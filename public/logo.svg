  <path d="M 145 88 L 160 95 L 165 85" fill="none" stroke="#2E8A4E" stroke-width="5" stroke-linecap="round"/> <!-- Arm -->

  <!-- Brand Title Text Below -->
  <text x="150" y="270" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="28" fill="#2B3037" text-anchor="middle" letter-spacing="2">觅谷健身训练营</text>
</svg>
