  <!-- MG.FIT Text -->
  <text x="205" y="115" font-family="'Noto Sans SC', sans-serif" font-weight="900" font-size="20" fill="#2E8A4E" text-anchor="middle" letter-spacing="1">MG.FIT</text>

  <!-- Left Large Leaf -->
  <path d="M 80 130 C 100 170, 130 190, 140 195 C 120 180, 100 155, 80 130 Z" fill="#2E8A4E" />

