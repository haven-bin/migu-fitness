  <path d="M 140 85 C 145 82, 155 82, 158 88 L 152 108 L 158 122 L 148 150 L 140 190 C 142 170, 145 155, 148 140 L 140 120 L 132 105 Z" fill="#2E8A4E"/> <!-- Body & Right Leg -->
